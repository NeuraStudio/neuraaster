name: NeuraAster Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins for modern AGP and compileSdk 34
        run: |
          python3 - <<'PY'
          import glob, os, re

          for g in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/*/android/build.gradle')):
              with open(g, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              new_lines = []
              for line in lines:
                  if "apply plugin:" in line and "kotlin" in line:
                      new_lines.append("// removed kotlin plugin\n")
                  elif "compileSdkVersion" in line:
                      new_lines.append("    compileSdkVersion 34\n")
                  elif "compileSdk " in line and "compileSdkVersion" not in line:
                      new_lines.append("    compileSdk 34\n")
                  else:
                      new_lines.append(line)

              txt = "".join(new_lines)
              txt = re.sub(r"kotlinOptions\s*\{[^}]*\}", "// removed kotlinOptions", txt)

              with open(g, 'w', encoding='utf-8') as f:
                  f.write(txt)
              print("Patched:", g)
          PY

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuraAster-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
