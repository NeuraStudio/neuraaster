name: NeuraAster Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create local.properties and grant permissions
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          chmod +x android/gradlew || true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 9
        run: python3 patch_dependencies.py

      - name: Build Android APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation || true

      - name: Locate and Stage APK
        run: |
          mkdir -p release_output
          APK_FILE=$(find . -type f -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Direct flutter search empty, checking android build folder..."
            cd android && ./gradlew assembleRelease --no-daemon && cd ..
            APK_FILE=$(find . -type f -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found anywhere!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" release_output/NeuraAster-Release.apk
          ls -lh release_output/NeuraAster-Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuraAster-Release-APK
          path: release_output/NeuraAster-Release.apk
