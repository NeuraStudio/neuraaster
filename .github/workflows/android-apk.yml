name: NeuraAster Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Generate Gradle 9.1 Wrapper
        run: |
          rm -rf /tmp/neuraaster-wrapper
          mkdir -p /tmp/neuraaster-wrapper
          printf '' > /tmp/neuraaster-wrapper/settings.gradle
          printf '' > /tmp/neuraaster-wrapper/build.gradle
          cd /tmp/neuraaster-wrapper
          gradle wrapper --gradle-version 9.1.0
          cp gradlew "$GITHUB_WORKSPACE/android/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
          rm -rf "$GITHUB_WORKSPACE/android/gradle"
          cp -R gradle "$GITHUB_WORKSPACE/android/gradle"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Fix gallery_saver_plus compileSdk
        shell: bash
        run: |
          set -e

          GALLERY_GRADLE=$(find "$HOME/.pub-cache" \
            -path "*/gallery_saver_plus-*/android/build.gradle" \
            -type f | head -n 1)

          if [ -z "$GALLERY_GRADLE" ]; then
            echo "ERROR: gallery_saver_plus Android build.gradle not found"
            exit 1
          fi

          echo "Found: $GALLERY_GRADLE"

          sed -i -E \
            's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 37/g;
             s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 37/g' \
            "$GALLERY_GRADLE"

          cat "$GALLERY_GRADLE"

      - name: Flutter Clean
        run: echo "Skipped flutter clean to preserve .dart_tool"

      - name: Direct Gradle Build
        working-directory: android
        run: ./gradlew app:assembleRelease --stacktrace --info

      - name: Verify APK
        run: |
          find build -type f -name "*.apk" -print
          test -f build/app/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuraAster-APK
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
