name: NeuraAster Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins for modern AGP
        run: |
          python3 - <<'PY'
          import glob, os, re
          
          # Fix gallery_saver_plus and similar plugins
          for g in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/*/android/build.gradle')):
              with open(g, 'r', encoding='utf-8', errors='ignore') as f:
                  txt = f.read()
              
              orig = txt
              # Remove deprecated kotlin-android plugin application
              txt = re.sub(r"apply plugin:\s*['\"](kotlin-android|org\.jetbrains\.kotlin\.android)['\"]", "// removed", txt)
              # Remove incompatible kotlinOptions
              txt = re.sub(r"kotlinOptions\s*\{[^}]*\}", "// removed kotlinOptions", txt)
              # Ensure compileSdk is defined
              if "compileSdk" not in txt and "android {" in txt:
                  txt = txt.replace("android {", "android {\n    compileSdk 34")
              
              if orig != txt:
                  with open(g, 'w', encoding='utf-8') as f:
                      f.write(txt)
                  print(f"Patched: {g}")
          PY

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuraAster-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
